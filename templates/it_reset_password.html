{% extends 'base.html' %}
{% block content %}
<h2>Reset Password</h2>
<div class="card">
  <p class="meta" style="margin-bottom:15px;">Resetting password for: <strong>{{ target_emp.full_name }} (@{{ target_emp.user.username }})</strong></p>
  <form method="post">
    {% csrf_token %}
    <label class="meta">New Password</label>
    <input type="text" name="password" required placeholder="Enter new password">
    <button class="btn btn-green wide" type="submit" style="margin-top:10px;">Reset Password</button>
    <a class="btn btn-grey wide" href="{% url 'it_user_management' %}">Cancel</a>
  </form>
</div>
{% endblock %}
