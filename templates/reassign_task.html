{% extends 'base.html' %}
{% block content %}
<h2>Reassign Task</h2>
<div class="card">
  <p class="meta" style="margin-bottom:15px;">You are about to reassign <strong>{{ task.title }}</strong> to another employee. This will instantly move it to their Action Center.</p>
  <form method="post">
    {% csrf_token %}
    <select name="new_employee" required>
      <option value="">-- Select New Employee --</option>
      {% for e in employees %}
        <option value="{{ e.id }}">{{ e.full_name }} ({{ e.get_role_display }})</option>
      {% endfor %}
    </select>
    <button class="btn btn-green wide" type="submit" style="margin-top:10px;">Confirm Reassignment</button>
    <a class="btn btn-grey wide" href="{% url 'task_detail' task.id %}">Cancel</a>
  </form>
</div>
{% endblock %}
