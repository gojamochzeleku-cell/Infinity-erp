{% extends 'base.html' %}
{% block title %}{{ room.name }}{% endblock %}
{% block content %}
<style>
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 160px); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: #0f1115; border-radius: 12px; border: 1px solid #232838; margin-bottom: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 13px; position: relative; word-wrap: break-word; }
  .msg-me { align-self: flex-end; background: #1f8a4c; color: #fff; border-bottom-right-radius: 2px; }
  .msg-other { align-self: flex-start; background: #232838; color: #e6e8ee; border-bottom-left-radius: 2px; }
  .msg-meta { font-size: 9px; opacity: 0.7; text-align: right; margin-top: 4px; }
  .chat-input { display: flex; gap: 8px; align-items: center; }
  .chat-input input[type="text"] { flex: 1; margin: 0; border-radius: 20px; }
  .voice-btn { background: #e2504a; color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .voice-btn.recording { animation: pulse 1s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
</style>

<div style="display:flex; align-items:center; margin-bottom:15px; gap:10px;">
  <a href="{% url 'chat_dashboard' %}" style="color:#e8b64c; font-size:20px;">←</a>
  <h2 style="margin:0;">{{ room.name }}</h2>
</div>

<div class="chat-container">
  <div class="chat-messages" id="chat-box">
    <!-- Messages will be loaded here -->
  </div>
  
  <div class="chat-input">
    <button type="button" class="voice-btn" id="record-btn" title="Hold to record">🎤</button>
    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
    <button class="btn btn-green" id="send-btn" style="margin:0; border-radius:50%; width:45px; height:45px; padding:0;">➤</button>
  </div>
</div>

<script>
    const roomId = {{ room.id }};
    const myId = {{ user.employee.id }};
    let lastMsgId = 0;
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const recordBtn = document.getElementById('record-btn');

    // 1. Fetch Messages (Polling)
    function fetchMessages() {
        fetch(`/chat/${roomId}/messages/?last_id=${lastMsgId}`)
            .then(res => res.json())
            .then(data => {
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        appendMessage(msg);
                        lastMsgId = Math.max(lastMsgId, msg.id);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
    }

    function appendMessage(msg) {
        const div = document.createElement('div');
        div.className = 'msg ' + (msg.sender_id === myId ? 'msg-me' : 'msg-other');
        
        let content = '';
        if (msg.text) content += `<div>${msg.text}</div>`;
        if (msg.audio_url) content += `<audio controls src="${msg.audio_url}" style="max-width:100%; margin-top:5px;"></audio>`;
        
        div.innerHTML = `
            ${msg.sender_id !== myId ? `<div style="font-size:10px; font-weight:bold; color:#4cc7e8; margin-bottom:4px;">${msg.sender}</div>` : ''}
            ${content}
            <div class="msg-meta">${msg.time}</div>
        `;
        chatBox.appendChild(div);
    }

    setInterval(fetchMessages, 3000); // Poll every 3 seconds
    fetchMessages(); // Initial load

    // 2. Send Text Message
    function sendMessage(text, audioBlob = null) {
        const formData = new FormData();
        if (text) formData.append('text', text);
        if (audioBlob) formData.append('audio', audioBlob, 'voice_note.webm');
        
        fetch(`/chat/${roomId}/send/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
            body: formData
        }).then(() => {
            msgInput.value = '';
            fetchMessages(); // Refresh instantly
        });
    }

    sendBtn.onclick = () => { if (msgInput.value.trim()) sendMessage(msgInput.value.trim()); };
    msgInput.onkeypress = (e) => { if (e.key === 'Enter' && msgInput.value.trim()) sendMessage(msgInput.value.trim()); };

    // 3. Voice Recording
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    recordBtn.onclick = async () => {
        if (!isRecording) {
            // Start recording
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    sendMessage(null, audioBlob);
                    audioChunks = [];
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerHTML = '⏹️';
            } catch (err) {
                alert('Microphone access denied or not available.');
            }
        } else {
            // Stop recording
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordBtn.innerHTML = '🎤';
        }
    };
</script>
{% endblock %}
