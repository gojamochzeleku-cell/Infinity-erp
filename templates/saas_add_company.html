{% extends 'base.html' %}
{% block content %}
<h2>Onboard New Company</h2>
<div class="card">
  <form method="post">
    {% csrf_token %}
    <label class="meta">Company Full Name</label>
    <input type="text" name="name" required placeholder="e.g. Abyssinia Trading PLC">
    
    <label class="meta">Company Code (Short Name)</label>
    <input type="text" name="short_name" required placeholder="e.g. ABY">
    
    <button class="btn btn-green wide" type="submit" style="margin-top:15px;">Create Company Workspace</button>
    <a class="btn btn-grey wide" href="{% url 'saas_dashboard' %}">Cancel</a>
  </form>
</div>
{% endblock %}
