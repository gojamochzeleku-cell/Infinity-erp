{% extends 'base.html' %}
{% block title %}New Memo{% endblock %}
{% block content %}
<h2>Create Memo</h2>
<div class="card">
  <form method="post">
    {% csrf_token %}

    <label class="meta">Title</label>
    <input type="text" name="title" required maxlength="250">

    <label class="meta">Content</label>
    <textarea name="content" required></textarea>

    <label class="meta">Send to Role (Optional)</label>
    <select name="recipient_role">
      <option value="">-- Everyone in this company --</option>
      {% for code, name in roles %}
        <option value="{{ code }}">{{ name }}</option>
      {% endfor %}
    </select>

    <label class="meta">Or Send to Specific Employee (Optional)</label>
    <select name="recipient_employee">
      <option value="">-- No specific employee --</option>
      {% for e in employees %}
        <option value="{{ e.id }}">{{ e.full_name }}</option>
      {% endfor %}
    </select>

    <button class="btn btn-green" type="submit" style="margin-top:10px;">Send Memo</button>
    <a class="btn btn-grey" href="{% url 'memo_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
