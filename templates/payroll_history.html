{% extends 'base.html' %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
  <h2>Payroll History</h2>
  {% if user.employee.role in "ADMIN,HR" %}
  <a href="{% url 'generate_payroll' %}" class="btn btn-green" style="padding:6px 12px; font-size:12px;">+ Generate New</a>
  {% endif %}
</div>

{% for p in payrolls %}
  <div class="card">
    <div class="row">
      <span class="ttl">{{ p.month }} {{ p.year }}</span>
      <span class="pill {% if p.status == 'PAID' %}completed{% else %}pending{% endif %}">{{ p.status }}</span>
    </div>
    <div class="kv"><span class="k">Total Amount</span><span class="v" style="color:#e8b64c; font-weight:bold;">{{ p.total_amount }} ETB</span></div>
  </div>
{% empty %}
  <p class="empty">No payroll records.</p>
{% endfor %}
{% endblock %}
