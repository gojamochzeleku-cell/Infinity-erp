<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supplier Portal - Infinity Investment Institute</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, Roboto, sans-serif; background: #0f1115; color: #e6e8ee; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #151922; border: 1px solid #232838; border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; }
        .logo { text-align: center; font-size: 40px; color: #e8b64c; margin-bottom: 10px; }
        h1 { text-align: center; font-size: 20px; margin-bottom: 5px; }
        .sub { text-align: center; color: #8f99b0; font-size: 12px; margin-bottom: 20px; }
        .tender-info { background: #0f1115; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 3px solid #4cc7e8; }
        label { font-size: 12px; color: #8f99b0; display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; background: #0f1115; border: 1px solid #333a4d; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        button { width: 100%; background: #1f8a4c; color: #fff; font-weight: bold; padding: 15px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">&#8734;</div>
        <h1>Infinity Investment Institute</h1>
        <div class="sub">Secure Supplier Upload Portal</div>

        <div class="tender-info">
            <div class="meta" style="color:#8f99b0; font-size:10px; text-transform:uppercase;">Tender Reference</div>
            <div style="font-weight:bold; font-size:14px; margin-bottom:5px;">{{ tender.serial_number }}</div>
            <div class="meta" style="font-size:12px;">{{ tender.bid_title|truncatechars:60 }}</div>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Supplier / Company Name</label>
            <input type="text" name="company_name" required placeholder="e.g., Shenzhen Tech Ltd">

            <label>Upload Proforma Invoice (PDF/Image)</label>
            <input type="file" name="proforma_file" required style="color:#c8cfdd;">

            <label>Upload Manufacturer Authorization (Optional)</label>
            <input type="file" name="auth_file" style="color:#c8cfdd;">

            <button type="submit">Submit Documents Securely</button>
        </form>
    </div>
</body>
</html>
