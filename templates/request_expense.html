{% extends 'base.html' %}
{% block title %}Request Expense or Loan{% endblock %}
{% block content %}
<h2>Request Expense or Loan</h2>
<div class="card">
  <form method="post">
    {% csrf_token %}
    
    <label class="meta">Request Type</label>
    <select name="request_type" id="req-type" required style="margin-bottom:10px;">
      <option value="EXPENSE">Expense Reimbursement</option>
      <option value="LOAN">Salary Advance / Loan</option>
    </select>

    <label class="meta">Amount (ETB)</label>
    <input type="number" step="0.01" name="amount" required placeholder="0.00" style="margin-bottom:10px;">

    <div id="loan-fields" style="display:none; background:#1a1f2b; padding:10px; border-radius:8px; margin-bottom:10px; border:1px solid #333a4d;">
      <label class="meta" style="color:#e8b64c;">Repayment Period (Months)</label>
      <input type="number" name="repayment_months" value="1" min="1" style="margin-bottom:5px;">
      <div class="meta" style="font-size:10px;">This amount will be deducted from your salary over this period.</div>
    </div>

    <label class="meta">Reason / Justification</label>
    <textarea name="reason" required placeholder="Explain why you need this..."></textarea>
    
    <button class="btn btn-green wide" type="submit" style="margin-top:10px;">Submit Request to Finance</button>
  </form>
</div>

<script>
    document.getElementById('req-type').addEventListener('change', function() {
        const loanFields = document.getElementById('loan-fields');
        if (this.value === 'LOAN') {
            loanFields.style.display = 'block';
        } else {
            loanFields.style.display = 'none';
        }
    });
</script>
{% endblock %}
