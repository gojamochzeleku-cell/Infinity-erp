{% extends 'base.html' %}
{% block title %}Enter Code{% endblock %}
{% block content %}
<div class="logo">
  <div class="mark">🔐</div>
  <h1>Enter Verification Code</h1>
  <p>Check your Telegram for the 6-digit code.</p>
</div>

<div class="card">
  {% if error %}<div style="color:#e2504a; font-size:12px; margin-bottom:10px; text-align:center;">{{ error }}</div>{% endif %}
  
  <form method="post">
    {% csrf_token %}
    <input type="text" name="code" placeholder="6-digit code" required style="text-align:center; font-size:20px; letter-spacing:5px;">
    <input type="password" name="new_password" placeholder="New Password" required>
    <button class="btn btn-green wide" type="submit">Reset Password</button>
    <a class="btn btn-grey wide" href="{% url 'forgot_password' %}" style="margin-top:10px;">Didn't get code? Try again</a>
  </form>
</div>
{% endblock %}
