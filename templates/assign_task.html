{% extends 'base.html' %}
{% block title %}Assign Task{% endblock %}
{% block content %}
<h2>Assign Task to Employee</h2>
<div class="card">
  <form method="post">
    {% csrf_token %}
    
    <label class="meta">Task Title</label>
    <input type="text" name="title" required placeholder="e.g. Review the Ministry Bid Document">
    
    <label class="meta">Instructions / Description</label>
    <textarea name="description" placeholder="Provide detailed instructions..." style="min-height:80px;"></textarea>
    
    <label class="meta">Assign To</label>
    <select name="assignee" required>
      <option value="">-- Select Employee --</option>
{% if pre_role %}<option value="" disabled style="color:#e8b64c;">Pre-filtered for: {{ pre_role }}</option>{% endif %}
      {% for e in employees %}
        <option value="{{ e.id }}" {% if pre_role == e.role %}selected{% endif %}>{{ e.full_name }} ({{ e.get_role_display }})</option>
      {% endfor %}
    </select>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
      <div>
        <label class="meta">Due Date</label>
        <input type="date" name="due_date" style="margin-bottom:0;">
      </div>
      <div>
        <label class="meta">Priority</label>
        <select name="priority" style="margin-bottom:0;">
          <option value="NORMAL">Normal</option>
          <option value="HIGH">High</option>
          <option value="URGENT">Urgent</option>
        </select>
      </div>
    </div>

    <button class="btn btn-green wide" type="submit" style="margin-top:15px;">Assign Task & Notify</button>
    <a class="btn btn-grey wide" href="{% url 'dashboard' %}">Cancel</a>
  </form>
</div>
{% endblock %}
