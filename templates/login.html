{% extends 'base.html' %}
{% block title %}Login - Infinity Investment Institute{% endblock %}
{% block content %}
<div class="logo">
  <div class="mark">&#8734;</div>
  <h1>Infinity Investment Institute</h1>
  <p>Tender &amp; Import Management System</p>
</div>
<div class="card">
  <form method="post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    {% if form.errors %}<div style="color:#e2504a;font-size:12px;margin-bottom:10px">Wrong username or password.</div>{% endif %}
    <button class="btn btn-green wide" type="submit">Sign in</button>
    <div style="text-align:center; margin-top:15px;">
      <a href="{% url 'forgot_password' %}" style="color:#4cc7e8; font-size:12px; text-decoration:none;">Forgot Password?</a>
    </div>
  </form>
</div>
{% endblock %}
